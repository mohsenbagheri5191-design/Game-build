<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toronto Builder">
<meta name="theme-color" content="#111820">
<meta name="color-scheme" content="dark light">
<meta name="description" content="A low-poly city builder on the real streets of downtown Toronto.">
<title>Toronto Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316202b%22%2F%3E%3Cpath%20d%3D%22M20%2046V28l7-5%207%205v18z%22%20fill%3D%22%23e8d9b8%22%2F%3E%3Cpath%20d%3D%22M38%2046V20l4-3%204%203v26z%22%20fill%3D%22%23c8b48b%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2246%22%20width%3D%2238%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%236d7f8c%22%2F%3E%3C%2Fsvg%3E">
<style>/* ---------------------------------------------------------------------------
   Toronto Builder — interface
   Portrait phone first. Every control is at least 44px. Large text and high
   contrast reflow rather than scale, and reduced motion removes transitions
   rather than shortening them.
--------------------------------------------------------------------------- */

:root {
  --bg: #0d1218;
  --panel: #161e27;
  --panel-2: #1e2833;
  --panel-3: #27333f;
  --line: #33404e;
  --ink: #eaf1f7;
  --ink-2: #a9bacb;
  --ink-3: #74879a;
  --accent: #64e6c8;
  --accent-ink: #06231d;
  --warn: #ffbe5c;
  --bad: #ff6b6b;
  --good: #8fdc7a;
  --coin: #ffd76a;

  --r-lg: 20px;
  --r-md: 13px;
  --r-sm: 9px;
  --tap: 44px;

  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --fs-xxl: 26px;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  --dur: 220ms;
  --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
}

/* accessibility modes ----------------------------------------------------- */
body.large-text {
  --fs-xs: 13px; --fs-sm: 15px; --fs-md: 17px; --fs-lg: 19px;
  --fs-xl: 24px; --fs-xxl: 30px; --tap: 52px;
}
body.high-contrast {
  --bg: #000000; --panel: #0b0f14; --panel-2: #14202c; --panel-3: #1d2c3a;
  --line: #6f8496; --ink: #ffffff; --ink-2: #dfe9f2; --ink-3: #b9cad9;
  --accent: #7cffe0;
}
body.high-contrast .btn, body.high-contrast .chip, body.high-contrast .card { border-width: 2px; }
body.reduced-motion * { transition: none !important; animation: none !important; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--bg); color: var(--ink);
  overflow: hidden; overscroll-behavior: none;
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  font-size: var(--fs-md);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}

#app { position: fixed; inset: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- primitives */
.btn {
  min-height: var(--tap); min-width: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 0 14px; border-radius: var(--r-md);
  background: var(--panel-2); border: 1px solid var(--line);
  color: var(--ink); font-size: var(--fs-md); font-weight: 600;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.btn:active { transform: scale(0.96); background: var(--panel-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: #43222a; border-color: #7a3b45; color: #ffc9c9; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn[disabled] { opacity: 0.42; pointer-events: none; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.tiny { font-size: var(--fs-xs); }
.small { font-size: var(--fs-sm); }
.big { font-size: var(--fs-xl); font-weight: 700; }
.center { text-align: center; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

.card {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 12px;
}
.card + .card { margin-top: 9px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 999px;
  background: var(--panel-3); border: 1px solid var(--line);
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
}
.chip.good { background: #1c3524; border-color: #2f5a3c; color: var(--good); }
.chip.warn { background: #3a2f18; border-color: #6a552a; color: var(--warn); }
.chip.bad  { background: #3a1f22; border-color: #6d3339; color: var(--bad); }

.bar { height: 8px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

hr.sep { border: none; border-top: 1px solid var(--line); margin: 12px 0; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: var(--fs-sm); }
.kv + .kv { border-top: 1px dashed var(--line); }
.kv b { font-weight: 700; }

/* ---------------------------------------------------------------------- HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }

.hud-top {
  position: absolute; top: calc(var(--safe-t) + 8px); left: calc(var(--safe-l) + 8px);
  right: calc(var(--safe-r) + 8px);
  display: flex; align-items: flex-start; gap: 8px;
}
.hud-pill {
  display: flex; align-items: center; gap: 8px;
  background: rgba(14, 20, 27, 0.82); backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 12px; min-height: 40px;
  font-size: var(--fs-sm); font-weight: 700;
}
.hud-pill .coin { color: var(--coin); }
.hud-pill .lvl { color: var(--accent); }

.hud-right {
  position: absolute; right: calc(var(--safe-r) + 8px);
  top: calc(var(--safe-t) + 58px);
  display: flex; flex-direction: column; gap: 8px;
}
body.left-handed .hud-right { right: auto; left: calc(var(--safe-l) + 8px); }
body.left-handed .hud-bottom-left { left: auto; right: calc(var(--safe-r) + 8px); }

.icon-btn {
  width: var(--tap); height: var(--tap); border-radius: 50%;
  background: rgba(14, 20, 27, 0.82); backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  transition: transform var(--dur) var(--ease);
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.on { background: var(--accent); color: var(--accent-ink); }

.compass { position: relative; }
.compass .needle {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: transform 90ms linear;
}
.compass .cardinal {
  position: absolute; bottom: 2px; left: 0; right: 0; text-align: center;
  font-size: 9px; font-weight: 800; color: var(--ink-2);
}

.hud-bottom-left {
  position: absolute; left: calc(var(--safe-l) + 8px);
  bottom: calc(var(--safe-b) + 8px);
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}

/* toast ------------------------------------------------------------------- */
#toasts {
  position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 96px);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; padding: 0 16px;
}
.toast {
  background: rgba(14, 20, 27, 0.94); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 15px; font-size: var(--fs-sm); font-weight: 600;
  max-width: 100%; text-align: center;
  animation: toastIn var(--dur) var(--ease);
}
.toast.bad { border-color: #6d3339; color: #ffc9c9; }
.toast.good { border-color: #2f5a3c; color: #c7f0bb; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --------------------------------------------------------------------- sheet */
.scrim {
  position: absolute; inset: 0; background: rgba(3, 6, 9, 0.55);
  opacity: 0; transition: opacity var(--dur) var(--ease); pointer-events: none;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--panel);
  border-top: 1px solid var(--line);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.45);
  transform: translateY(102%);
  transition: transform var(--dur) var(--ease);
  display: flex; flex-direction: column;
  max-height: calc(100% - var(--safe-t) - 12px);
  padding-bottom: var(--safe-b);
  will-change: transform;
}
.sheet.open { transform: translateY(0); }
.sheet.full { top: var(--safe-t); border-radius: var(--r-lg) var(--r-lg) 0 0; }

.sheet-grab { padding: 8px 0 4px; display: flex; justify-content: center; flex: 0 0 auto; touch-action: none; }
.sheet-grab i { width: 40px; height: 4px; border-radius: 999px; background: var(--line); display: block; }

.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 12px 10px; flex: 0 0 auto;
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.01em; }
.sheet-head .sub { font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; }

.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px; flex: 1 1 auto; overscroll-behavior: contain;
  touch-action: pan-y;
}
.sheet-body::-webkit-scrollbar { width: 0; }

.sheet-foot {
  padding: 10px 12px; border-top: 1px solid var(--line);
  display: flex; gap: 8px; flex: 0 0 auto; background: var(--panel);
}
.sheet-foot .btn { flex: 1 1 auto; }

/* ------------------------------------------------------------------ menu grid */
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.menu-tile {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md);
  min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; padding: 8px 4px; text-align: center;
}
.menu-tile .ico { font-size: 23px; }
.menu-tile .lbl { font-size: var(--fs-xs); font-weight: 700; }
.menu-tile:active { background: var(--panel-3); }
.menu-tile .badge {
  position: absolute; transform: translate(22px, -22px);
  background: var(--bad); color: #fff; border-radius: 999px;
  font-size: 10px; font-weight: 800; padding: 1px 5px;
}

/* ------------------------------------------------------------- catalogue grid */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; padding: 8px 12px; min-height: 38px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-size: var(--fs-sm); font-weight: 700; white-space: nowrap;
}
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.search {
  width: 100%; min-height: var(--tap); padding: 0 12px; border-radius: var(--r-md);
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  font-size: var(--fs-md);
}
.search::placeholder { color: var(--ink-3); }

.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat-item {
  position: relative; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 6px; display: flex; flex-direction: column; gap: 4px;
  min-height: 104px;
}
.cat-item.on { border-color: var(--accent); background: #15302c; }
.cat-item.locked { opacity: 0.55; }
.cat-item .thumb {
  width: 100%; aspect-ratio: 1 / 1; border-radius: var(--r-sm);
  background: #0e151c; display: block; overflow: hidden;
}
.cat-item .thumb canvas, .cat-item .thumb img { width: 100%; height: 100%; display: block; }
.cat-item .nm { font-size: 10.5px; font-weight: 700; line-height: 1.2; }
.cat-item .pr { font-size: 10px; font-weight: 700; color: var(--coin); }
.cat-item .lk { font-size: 10px; font-weight: 700; color: var(--warn); }
.cat-item .fav {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px;
  border-radius: 50%; background: rgba(0,0,0,0.45); display: flex;
  align-items: center; justify-content: center; font-size: 13px;
}

.recent-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.recent-row::-webkit-scrollbar { display: none; }
.recent-row .cat-item { flex: 0 0 82px; min-height: 82px; }
.recent-row .cat-item .nm { display: none; }

/* ------------------------------------------------------------------ build bar */
#buildbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(16, 22, 29, 0.94); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(var(--safe-b) + 8px);
  transform: translateY(105%); transition: transform var(--dur) var(--ease);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 5;
}
#buildbar.open { transform: translateY(0); }

.tool-row { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tool-row::-webkit-scrollbar { display: none; }
.tool {
  flex: 0 0 auto; min-width: 52px; min-height: var(--tap);
  border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 4px 6px;
}
.tool .ico { font-size: 16px; line-height: 1; }
.tool .lbl { font-size: 9px; font-weight: 800; letter-spacing: 0.01em; }
.tool.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tool[disabled] { opacity: 0.4; }

.held {
  display: flex; align-items: center; gap: 9px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 7px 9px; min-height: 52px;
}
.held .thumb { width: 38px; height: 38px; border-radius: var(--r-sm); background: #0e151c; overflow: hidden; flex: 0 0 auto; }
.held .thumb canvas { width: 100%; height: 100%; display: block; }
.held .nm { font-size: var(--fs-sm); font-weight: 800; }
.held .pr { font-size: var(--fs-xs); color: var(--coin); font-weight: 700; }

.storey-row { display: flex; align-items: center; gap: 6px; }
.storey-pill {
  min-width: 46px; min-height: 34px; border-radius: var(--r-sm);
  background: var(--panel-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-sm); font-weight: 800;
}
.storey-pill.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* ---------------------------------------------------------------- colour zone */
.zone-row { display: flex; gap: 6px; margin-bottom: 8px; }
.zone-btn {
  flex: 1 1 0; min-height: 46px; border-radius: var(--r-sm);
  border: 2px solid var(--line); background: var(--panel-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 10px; font-weight: 800;
}
.zone-btn.on { border-color: var(--accent); }
.zone-btn .sw { width: 26px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.28); }

.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.swatch {
  aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent;
  min-height: 30px;
}
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

.picker-row { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
.picker-row input[type=color] {
  width: 52px; height: 40px; border: 1px solid var(--line);
  border-radius: var(--r-sm); background: var(--panel-2); padding: 2px;
}

/* -------------------------------------------------------------------- toggles */
.setting { display: flex; align-items: center; gap: 12px; min-height: var(--tap); padding: 4px 0; }
.setting .lbl { flex: 1 1 auto; font-size: var(--fs-sm); font-weight: 600; }
.setting + .setting { border-top: 1px dashed var(--line); }

.switch {
  width: 50px; height: 30px; border-radius: 999px; background: var(--panel-3);
  border: 1px solid var(--line); position: relative; flex: 0 0 auto;
  transition: background var(--dur) var(--ease);
}
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: var(--ink-2);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.switch.on { background: var(--accent); border-color: transparent; }
.switch.on::after { transform: translateX(20px); background: #06231d; }

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 30px;
  background: transparent;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px; background: var(--panel-3);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); margin-top: -9px; border: 2px solid #06231d;
}
select.sel {
  min-height: var(--tap); border-radius: var(--r-md); background: var(--panel-2);
  border: 1px solid var(--line); padding: 0 10px; font-size: var(--fs-sm); font-weight: 600;
}

/* --------------------------------------------------------------- list entries */
.list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; min-height: 56px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md);
}
.list-item + .list-item { margin-top: 7px; }
.list-item .av { width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto; overflow: hidden; background: #0e151c; }
.list-item .av canvas { width: 100%; height: 100%; }
.list-item .txt { flex: 1 1 auto; min-width: 0; }
.list-item .txt .t1 { font-size: var(--fs-sm); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .txt .t2 { font-size: var(--fs-xs); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.thread { display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 82%; padding: 8px 11px; border-radius: 14px; font-size: var(--fs-sm); line-height: 1.35; }
.msg.them { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; font-weight: 600; }
.msg .who { font-size: 10px; font-weight: 800; opacity: 0.7; margin-bottom: 2px; }

.composer { display: flex; gap: 7px; }
.composer input {
  flex: 1 1 auto; min-height: var(--tap); border-radius: var(--r-md);
  background: var(--panel-2); border: 1px solid var(--line); padding: 0 12px;
}

/* -------------------------------------------------------------------- splash */
#splash {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 32px; text-align: center; z-index: 50;
  transition: opacity 420ms var(--ease);
}
#splash.gone { opacity: 0; pointer-events: none; }
#splash .title { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; }
#splash .sub { font-size: var(--fs-sm); color: var(--ink-2); max-width: 300px; line-height: 1.45; }
#splash .track { width: min(280px, 76vw); height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
#splash .track > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 200ms linear; }
#splash .pct { font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
#splash .skyline { width: min(320px, 84vw); height: 74px; opacity: 0.9; }

/* ------------------------------------------------------------------ tutorial */
.coach {
  position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 150px);
  background: rgba(16, 22, 29, 0.96); border: 1px solid var(--accent);
  border-radius: var(--r-md); padding: 13px; z-index: 20;
  box-shadow: 0 10px 34px rgba(0,0,0,0.5);
}
.coach h3 { margin: 0 0 5px; font-size: var(--fs-lg); font-weight: 800; }
.coach p { margin: 0 0 10px; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.45; }

/* ---------------------------------------------------------- site card compact */
.sitecard .addr { font-size: var(--fs-xxl); font-weight: 900; letter-spacing: -0.02em; line-height: 1.08; }
.sitecard .where { font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600; margin-top: 3px; }
.sitecard .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 12px; }
.fact { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 9px; }
.fact .k { font-size: 10px; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.fact .v { font-size: var(--fs-md); font-weight: 800; margin-top: 2px; }

/* ------------------------------------------------------------------- avatar */
.avatar-stage { width: 100%; aspect-ratio: 1 / 1; max-height: 34vh; border-radius: var(--r-md); background: #0e151c; overflow: hidden; }
.avatar-stage canvas { width: 100%; height: 100%; display: block; }
.part-pick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.part-pick::-webkit-scrollbar { display: none; }
.part-pick .p {
  flex: 0 0 auto; min-width: 46px; min-height: 40px; border-radius: var(--r-sm);
  background: var(--panel-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: var(--fs-sm); font-weight: 800;
}
.part-pick .p.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* -------------------------------------------------------------------- misc */
.empty { text-align: center; padding: 28px 16px; color: var(--ink-3); font-size: var(--fs-sm); }
.empty .ico { font-size: 34px; display: block; margin-bottom: 8px; opacity: 0.6; }
.scroll-x { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }

#perf {
  position: absolute; left: 8px; bottom: calc(var(--safe-b) + 8px);
  font: 600 10px/1.35 ui-monospace, monospace; color: var(--ink-2);
  background: rgba(10,16,22,0.7); padding: 4px 7px; border-radius: 7px;
  pointer-events: none; white-space: pre;
}
</style>
